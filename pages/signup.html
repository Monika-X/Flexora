<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexora | Sign Up</title>

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">

  <script src="../js/theme.js"></script>
  <script src="../js/rtl.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/animations.js"></script>
  <script src="../js/form-validation.js"></script>
  <script src="../js/script.js"></script>
</head>

<body data-no-navbar="true"
  style="display: flex; flex-direction: column; min-height: 100vh; justify-content: center; align-items: center; background-image: linear-gradient(rgba(18,18,18,0.85), rgba(18,18,18,0.85)), url('https://images.unsplash.com/photo-1540497077202-7c8a3999166f?auto=format&fit=crop&w=1920&q=80'); background-size: cover; background-position: center; background-attachment: fixed;">

  <div style="position: fixed; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 1000;">
    <button class="control-btn" onclick="toggleTheme()" aria-label="Toggle Theme"
      style="background: var(--glass-bg-strong); border: 1px solid var(--glass-border); border-radius: 8px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--color-text); font-size: 1.2rem; backdrop-filter: blur(10px);">
      <i class="theme-icon fas fa-sun"></i>
    </button>
    <button class="control-btn" onclick="toggleRTL()" aria-label="Toggle RTL"
      style="background: var(--glass-bg-strong); border: 1px solid var(--glass-border); border-radius: 8px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--color-text); font-size: 1rem; font-weight: bold; font-family: var(--font-body); backdrop-filter: blur(10px);">
      <span id="rtlToggleText">LTR</span>
    </button>
  </div>

  <div class="container reveal auth-container" style="max-width: 600px; width: 100%; padding: 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="../index.html" class="navbar-brand hover-scale"
        style="font-size: 3rem; text-decoration: none; display: inline-block; color: var(--color-primary) !important;">FLEXORA</a>
    </div>

    <div class="card auth-card"
      style="padding: 3rem; box-shadow: 0 20px 50px var(--card-shadow); border: 1px solid var(--glass-border); backdrop-filter: blur(10px); background-color: var(--glass-bg-strong);">
      <h2 style="margin-bottom: 2rem; text-align: center; font-size: 2rem;">Join the Community</h2>
      <form>
        <div class="form-row-grid"
          style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
          <div class="form-group">
            <label class="form-label">First Name</label>
            <input type="text" class="form-control" required placeholder="John"
              style="background-color: var(--input-bg-solid); border: 1px solid var(--color-border); color: var(--text-inverse);">
          </div>
          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input type="text" class="form-control" required placeholder="Doe"
              style="background-color: var(--input-bg-solid); border: 1px solid var(--color-border); color: var(--text-inverse);">
          </div>
        </div>
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" required placeholder="name@example.com"
            style="background-color: var(--input-bg-solid); border: 1px solid var(--color-border); color: var(--text-inverse);">
        </div>
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="form-label">Password</label>
          <div style="position: relative;">
            <input type="password" class="form-control" required placeholder="********"
              style="padding-right: 40px; background-color: var(--input-bg-solid); border: 1px solid var(--color-border); color: var(--text-inverse);">
            <i class="fas fa-eye password-toggle hover-scale"
              style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--color-text-muted); transition: color 0.3s;"
              onclick="togglePassword(this)"></i>
          </div>
        </div>
        <div class="form-group" style="margin-bottom: 2rem;">
          <label
            style="color: var(--color-text-muted); display: flex; align-items: center; gap: 8px; cursor: pointer;"><input
              type="checkbox" required style="cursor: pointer;"> I agree to the <a href="terms-and-conditions.html"
              class="text-primary hover-scale" style="display: inline-block;">Terms & Conditions</a></label>
        </div>
        <button type="submit" class="btn btn-primary hover-lift"
          style="width: 100%; padding: 15px; font-size: 1.1rem;">Create Account</button>
      </form>

      <p style="text-align: center; margin-top: 2rem; color: var(--color-text-muted); font-size: 1.05rem;">
        Already a member? <a href="login.html" class="text-primary hover-scale"
          style="font-weight: bold; display: inline-block;">Log in</a>
      </p>
    </div>
  </div>

  <script>
    // Password Eye Toggle
    document.querySelectorAll('.password-toggle').forEach(icon => {
      icon.addEventListener('click', function () {
        const input = this.previousElementSibling;
        if (input.type === 'password') {
          input.type = 'text';
          this.classList.remove('fa-eye');
          this.classList.add('fa-eye-slash');
          this.style.color = 'var(--color-primary)';
        } else {
          input.type = 'password';
          this.classList.remove('fa-eye-slash');
          this.classList.add('fa-eye');
          this.style.color = 'var(--color-text-muted)';
        }
      });
    });
  </script>
</body>

</html>
